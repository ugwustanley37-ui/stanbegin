<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Stanley Ugwu Portfolio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Stanley Ugwu, online course creator and LMS expert. Projects on Kajabi, Teachable, Thinkific, LearnWorlds, Moodle, Skool and more, with live client sites.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: full-width multi-page site (Home, About, Projects, Project detail, Contact) on hash routes.
   Deep green dominates, orange is the energy colour, white is used for reading surfaces. */
:root{
  --g9:#0A2A1B; --g8:#0F3D27; --g7:#145234; --g6:#1C6B44; --mint:#DCEBE1; --sage:#EEF4EF;
  --o5:#F28A12; --o6:#DB7409; --peach:#FFE6C7;
  --ink:#0F1F17; --muted:#56685E; --line:#D7E2DA; --white:#FFFFFF;
  --f-d:"Syne", "Arial Black", system-ui, sans-serif;
  --f-b:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --gx:max(20px, min(4.5vw, 72px));
  --ease:cubic-bezier(.19,1,.22,1);
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:auto;overflow-x:clip}
body{overflow-x:clip}
body{background:var(--g9);color:var(--ink);font-family:var(--f-b);font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:90;background:var(--g9)}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--o5);outline-offset:3px;border-radius:6px}
h1,h2,h3,h4{font-family:var(--f-d);font-weight:700;line-height:1.02;letter-spacing:-.025em;margin:0;text-wrap:balance}
p{margin:0}
.gx{padding-left:max(var(--gx), env(safe-area-inset-left, 0px));padding-right:max(var(--gx), env(safe-area-inset-right, 0px))}
.label{font-size:13px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;display:inline-flex;align-items:center;gap:12px}
.label::before{content:"";width:28px;height:2px;background:currentColor}
.o{color:var(--o5)}
main{background:var(--white)}

/* ---------- rolling text hover ---------- */
.roll{display:inline-flex;overflow:hidden;vertical-align:top;line-height:1.2;height:1.2em}
.roll .rw{display:flex;flex-direction:column;transition:transform .55s var(--ease)}
.roll .rw span{display:block;height:1.2em;white-space:pre}
a:hover .roll .rw, button:hover .roll .rw, .roll-host:hover .roll .rw{transform:translateY(-50%)}

/* ---------- buttons ---------- */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:12px;padding:18px 28px;border-radius:999px;font-weight:800;font-size:15px;letter-spacing:.02em;border:0;cursor:pointer;overflow:hidden;isolation:isolate;white-space:nowrap;transition:color .45s var(--ease)}
.btn::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;transform:translateY(101%);transition:transform .55s var(--ease)}
.btn:hover::before{transform:none}
.btn .ic{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;transition:transform .5s var(--ease)}
.btn:hover .ic{transform:rotate(-45deg)}
.b-or{background:var(--o5);color:var(--g9)}
.b-or::before{background:var(--white)}
.b-or .ic{background:var(--g9);color:var(--o5)}
.b-gr{background:var(--g8);color:#fff}
.b-gr::before{background:var(--o5)}
.b-gr:hover{color:var(--g9)}
.b-gr .ic{background:var(--o5);color:var(--g9)}
.b-ln{background:transparent;color:#fff;box-shadow:inset 0 0 0 1.5px rgb(255 255 255/.4)}
.b-ln::before{background:#fff}
.b-ln:hover{color:var(--g9)}
.b-ln.dark{color:var(--g8);box-shadow:inset 0 0 0 1.5px var(--line)}
.b-ln.dark::before{background:var(--g8)}
.b-ln.dark:hover{color:#fff}

/* ---------- cursor ---------- */
.cur,.cur-dot{position:fixed;left:0;top:0;pointer-events:none;z-index:200;border-radius:50%;display:none;opacity:0;transition:opacity .4s}
body.moved .cur,body.moved .cur-dot{opacity:1}
@media (pointer:fine){.cur,.cur-dot{display:block}}
.cur-dot{width:8px;height:8px;margin:-4px 0 0 -4px;background:var(--o5)}
.cur{width:40px;height:40px;margin:-20px 0 0 -20px;border:1.5px solid var(--o5);display:none;place-items:center;transition:width .4s var(--ease),height .4s var(--ease),margin .4s var(--ease),background .4s,border-color .4s}
@media (pointer:fine){.cur{display:grid}}
.cur span{font-size:13px;font-weight:800;color:var(--g9);opacity:0;transition:opacity .3s;letter-spacing:.04em}
.cur.big{width:104px;height:104px;margin:-52px 0 0 -52px;background:var(--o5);border-color:var(--o5)}
.cur.big span{opacity:1}
.cur.hov{width:60px;height:60px;margin:-30px 0 0 -30px;background:rgb(242 138 18/.15)}

/* ---------- preloader & transitions ---------- */
.loader{position:fixed;inset:0;z-index:150;background:var(--g9);color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:var(--gx);transition:transform 1s var(--ease)}
.loader .ln{font-family:var(--f-d);font-size:clamp(64px,14vw,220px);line-height:.9;font-weight:800;color:var(--o5);font-variant-numeric:tabular-nums}
.loader .nm{font-weight:700;letter-spacing:.2em;text-transform:uppercase;font-size:13px;margin-bottom:12px;opacity:.7}
.loader.done{transform:translateY(-100%)}
.wipe{position:fixed;inset:0;z-index:140;pointer-events:none;display:grid;grid-template-columns:repeat(5,1fr)}
.wipe i{background:var(--o5);transform:scaleY(0);transform-origin:bottom;transition:transform .5s var(--ease)}
.wipe i:nth-child(2){transition-delay:.04s;background:var(--g7)}.wipe i:nth-child(3){transition-delay:.08s}.wipe i:nth-child(4){transition-delay:.12s;background:var(--g7)}.wipe i:nth-child(5){transition-delay:.16s}
.wipe.in i{transform:scaleY(1)}
.wipe.out i{transform-origin:top;transform:scaleY(0)}

/* ---------- header ---------- */
.hd{position:fixed;left:0;right:0;top:env(safe-area-inset-top, 0px);z-index:80;color:#fff;transition:background .4s, transform .5s var(--ease)}
.hd.solid{background:rgb(10 42 27/.88);backdrop-filter:blur(14px)}
.hd.hide{transform:translateY(-110%)}
.hd-in{display:flex;align-items:center;gap:24px;height:84px}
.logo{display:flex;align-items:center;gap:12px;font-family:var(--f-d);font-weight:800;font-size:20px;letter-spacing:-.01em}
.logo .mk{width:40px;height:40px;border-radius:50%;background:var(--o5);color:var(--g9);display:grid;place-items:center;font-size:18px;transition:transform .6s var(--ease)}
.logo:hover .mk{transform:rotate(360deg)}
.nav{display:flex;gap:6px;margin-left:auto;align-items:center}
.nav a{font-weight:700;font-size:15px;padding:10px 16px;border-radius:99px;position:relative}
.nav a.on::after{content:"";position:absolute;left:50%;bottom:2px;width:6px;height:6px;border-radius:50%;background:var(--o5);transform:translateX(-50%)}
.hd .btn{padding:14px 22px}
.burger{display:none;margin-left:auto;width:52px;height:52px;border-radius:50%;background:var(--o5);border:0;cursor:pointer;position:relative}
.burger i{position:absolute;left:16px;right:16px;height:2px;background:var(--g9);transition:.4s var(--ease)}
.burger i:nth-child(1){top:21px}.burger i:nth-child(2){top:29px}
.menu-open .burger i:nth-child(1){top:25px;transform:rotate(45deg)}
.menu-open .burger i:nth-child(2){top:25px;transform:rotate(-45deg)}
@media (max-width:900px){.nav,.hd .btn{display:none}.burger{display:block}}
.mmenu{position:fixed;inset:0;z-index:79;background:var(--g8);color:#fff;padding:120px var(--gx) 40px;display:flex;flex-direction:column;justify-content:space-between;clip-path:circle(0 at calc(100% - 50px) 50px);transition:clip-path .8s var(--ease);visibility:hidden}
.menu-open .mmenu{clip-path:circle(150% at calc(100% - 50px) 50px);visibility:visible}
.mmenu nav{display:flex;flex-direction:column;gap:6px}
.mmenu nav a{font-family:var(--f-d);font-size:clamp(44px,12vw,80px);font-weight:800;line-height:1.05;transform:translateY(40px);opacity:0;transition:.7s var(--ease)}
.menu-open .mmenu nav a{transform:none;opacity:1}
.menu-open .mmenu nav a:nth-child(2){transition-delay:.06s}.menu-open .mmenu nav a:nth-child(3){transition-delay:.12s}.menu-open .mmenu nav a:nth-child(4){transition-delay:.18s}
.mmenu nav a:hover{color:var(--o5)}
.mmenu .soc{display:flex;gap:24px;font-weight:700}

/* ---------- page heroes (green) ---------- */
.phero{background:var(--g9);color:#fff;padding-block:170px 80px;position:relative;overflow:hidden}
.phero .grid-bg{position:absolute;inset:0;background-image:linear-gradient(rgb(255 255 255/.045) 1px,transparent 1px),linear-gradient(90deg,rgb(255 255 255/.045) 1px,transparent 1px);background-size:80px 80px;mask-image:linear-gradient(180deg,#000 30%,transparent)}
.phero h1{font-size:clamp(56px,11vw,190px);font-weight:800;line-height:.9;letter-spacing:-.04em;position:relative}
.phero .sub{font-size:clamp(17px,1.6vw,21px);max-width:38em;opacity:.8;margin-top:28px;position:relative}
.split .w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.06em}
.split .w > span{display:inline-block;transform:translateY(110%);transition:transform 1.1s var(--ease)}
.split.go .w > span{transform:none}

/* ---------- home hero ---------- */
.hero{background:var(--g9);color:#fff;position:relative;overflow:hidden;padding-block:130px 0}
.hero .glow{position:absolute;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle, rgb(242 138 18/.35), transparent 60%);left:50%;top:30%;transform:translate(-50%,-50%);pointer-events:none;transition:transform 1.2s var(--ease)}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;flex-wrap:wrap;position:relative;z-index:2}
.hero-top .role{font-weight:800;letter-spacing:.16em;text-transform:uppercase;font-size:13px}
.hero-top .role b{color:var(--o5)}
.hero-top .plats{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.7;text-align:right;max-width:420px}
.hero-stage{position:relative;margin-top:8px;height:clamp(460px,56vw,800px)}
.bigname{font-family:var(--f-d);font-weight:800;font-size:clamp(70px,17.5vw,330px);line-height:.8;letter-spacing:-.055em;text-align:center;width:100%;position:relative;z-index:1;color:var(--o5);white-space:nowrap;user-select:none}
.bigname .ch{display:inline-block;transform:translateY(105%);transition:transform 1.2s var(--ease)}
.hero.go .bigname .ch{transform:none}
.bigname-wrap{position:absolute;left:0;right:0;bottom:16%;overflow:hidden;padding-top:.02em}
.hero-photo{position:absolute;left:50%;bottom:0;height:100%;transform:translateX(-50%);z-index:2;pointer-events:none;display:flex;align-items:flex-end}
.hero-photo::after{content:"";position:absolute;left:-40%;right:-40%;bottom:0;height:22%;background:linear-gradient(transparent,var(--g9));}
.hero-photo img{height:100%;width:auto;max-width:none;filter:drop-shadow(0 30px 40px rgb(0 0 0/.35));transform:translateY(40px);opacity:0;transition:transform 1.4s .35s var(--ease),opacity 1s .35s}
.hero.go .hero-photo img{transform:none;opacity:1}
.badge{position:absolute;right:max(var(--gx), 6%);top:8%;width:150px;height:150px;z-index:3;display:grid;place-items:center}
.badge svg{position:absolute;inset:0;animation:spin 16s linear infinite}
.badge text{font-family:var(--f-b);font-weight:800;font-size:11.5px;letter-spacing:3px;fill:#fff;text-transform:uppercase}
.badge .core{width:64px;height:64px;border-radius:50%;background:var(--o5);display:grid;place-items:center;color:var(--g9);font-size:26px;transition:transform .5s var(--ease)}
.badge:hover .core{transform:scale(1.15) rotate(-45deg)}
@keyframes spin{to{transform:rotate(360deg)}}
.hero-bottom{position:relative;z-index:3;border-top:1px solid rgb(255 255 255/.12);padding-block:36px 48px;display:grid;grid-template-columns:1fr auto;gap:32px;align-items:end}
.hero-bottom > *{min-width:0}
.hero-bottom p{font-size:clamp(17px,1.5vw,21px);max-width:30em;opacity:.9}
.hero-bottom .ctas{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
.scrollcue{display:flex;flex-direction:column;align-items:center;gap:10px;font-size:12px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;opacity:.7}
.scrollcue i{width:1.5px;height:56px;background:linear-gradient(var(--o5),transparent);animation:cue 2s ease-in-out infinite;transform-origin:top}
@keyframes cue{0%{transform:scaleY(0)}50%{transform:scaleY(1)}100%{transform:scaleY(1);opacity:0}}
@media (max-width:820px){.bigname{white-space:normal;font-size:clamp(44px,13.6vw,130px);line-height:.86}.bigname .wd{display:block;white-space:nowrap;width:max-content;margin:0 auto}.hero-stage{height:clamp(440px,128vw,600px)}.bigname-wrap{bottom:auto;top:0}.hero-top .plats{display:none}.badge{display:none}.badge{width:110px;height:110px;top:2%}.badge text{font-size:9px}.badge .core{width:48px;height:48px;font-size:20px}.hero-bottom{grid-template-columns:1fr}.scrollcue{display:none}.hero-top .plats{text-align:left}}

/* ---------- marquee ---------- */
.mq{background:var(--o5);color:var(--g9);overflow:hidden;padding-block:26px;transform:rotate(-2deg) scale(1.04);margin-block:-10px;position:relative;z-index:4}
.mq.alt{background:var(--g8);color:#fff;transform:rotate(1.5deg) scale(1.04);margin-top:-30px;z-index:3}
.mq-t{display:flex;width:max-content;animation:mq 38s linear infinite}
.mq.alt .mq-t{animation-direction:reverse;animation-duration:44s}
.mq-t span{font-family:var(--f-d);font-weight:800;font-size:clamp(28px,4vw,56px);text-transform:uppercase;display:flex;align-items:center;gap:40px;padding-right:40px;white-space:nowrap}
.mq-t span::after{content:"✦";font-size:.6em;color:var(--g9)}
.mq.alt .mq-t span::after{color:var(--o5)}
@keyframes mq{to{transform:translateX(-50%)}}
.mq-wrap{background:var(--g9);padding-block:30px 40px;overflow:hidden;overflow:clip;contain:paint;max-width:100%}

/* ---------- sections ---------- */
.sec{padding-block:120px}
.sec.sage{background:var(--sage)}
.sec.dark{background:var(--g9);color:#fff}
.sec.green{background:var(--g8);color:#fff}
.sh{display:flex;justify-content:space-between;align-items:flex-end;gap:24px 48px;flex-wrap:wrap;margin-bottom:56px}
.sh > div{min-width:0}
.sh h2{font-size:clamp(44px,7vw,112px);font-weight:800;letter-spacing:-.04em;margin-top:18px}
.sh .label{color:var(--g6)}
.dark .sh .label,.green .sh .label{color:var(--o5)}
.textlink{font-weight:800;font-size:15px;letter-spacing:.08em;text-transform:uppercase;display:inline-flex;align-items:center;gap:10px;padding-bottom:6px;border-bottom:2px solid currentColor}
.textlink .arr{transition:transform .5s var(--ease)}
.textlink:hover .arr{transform:translateX(6px)}

/* reveal */
.rv{transition:opacity 1s var(--ease), transform 1s var(--ease)}
.rv.pre{opacity:0;transform:translateY(48px)}
.clip{overflow:hidden}
.clip img{transition:transform 1.4s var(--ease), clip-path 1.4s var(--ease)}
.clip.pre img{clip-path:inset(100% 0 0 0);transform:scale(1.25)}

/* ---------- project cards ---------- */
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:56px 28px}
.pgrid.sel{grid-template-columns:repeat(2,1fr);gap:72px 40px}
.pgrid.sel .pc:nth-child(even){margin-top:120px}
.pc{display:flex;flex-direction:column;gap:20px;cursor:pointer}
.pc .im{position:relative;border-radius:22px;overflow:hidden;aspect-ratio:4/3;background:var(--mint)}
.pgrid:not(.sel) .pc .im{aspect-ratio:16/11}
.pc .im img{width:100%;height:100%;object-fit:cover;object-position:top center;transition:transform 1.2s var(--ease)}
.pc:hover .im img{transform:scale(1.07)}
.pc .im::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgb(10 42 27/.55));opacity:0;transition:opacity .6s}
.pc:hover .im::after{opacity:1}
.pc .tag{position:absolute;left:18px;top:18px;z-index:2;background:var(--white);color:var(--g8);font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:8px 14px;border-radius:99px}
.pc .live{position:absolute;right:18px;top:18px;z-index:2;background:var(--o5);color:var(--g9);font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:8px 14px;border-radius:99px;display:flex;align-items:center;gap:6px}
.pc .live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--g9);animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.25}}
.pc .go{position:absolute;right:18px;bottom:18px;z-index:2;width:58px;height:58px;border-radius:50%;background:var(--o5);color:var(--g9);display:grid;place-items:center;font-size:22px;transform:scale(0) rotate(-90deg);transition:transform .6s var(--ease)}
.pc:hover .go{transform:scale(1) rotate(-45deg)}
@media (pointer:fine){.pc .go{display:none}}
.pc .meta{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.pc .meta > div{min-width:0}
.pc h3{font-size:clamp(22px,2vw,30px);font-weight:700;letter-spacing:-.02em;text-transform:uppercase}
.pgrid:not(.sel) .pc h3{font-size:clamp(19px,1.5vw,23px)}
.pc p{color:var(--muted);font-size:15px;margin-top:8px}
.pc .yr{font-weight:800;font-size:14px;color:var(--g6);white-space:nowrap}
@media (max-width:1100px){.pgrid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:720px){.pgrid,.pgrid.sel{grid-template-columns:1fr}.pgrid.sel .pc:nth-child(even){margin-top:0}}

/* ---------- about preview / about page ---------- */
.ab{display:grid;grid-template-columns:1fr 1fr;gap:clamp(40px,6vw,120px);align-items:center}
.ab > *{min-width:0}
.ab h2{font-size:clamp(48px,7vw,120px);font-weight:800;letter-spacing:-.04em}
.ab .txt p{font-size:clamp(17px,1.4vw,20px);color:var(--muted);margin-top:22px;max-width:34em}
.ab .txt p strong{color:var(--ink)}
.ab-photo{position:relative;border-radius:28px;overflow:hidden;aspect-ratio:4/4.6;background:var(--g8)}
.ab-photo .sun{position:absolute;width:70%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFB04A,var(--o5) 55%,var(--o6));left:15%;top:16%;transition:transform 1.4s var(--ease)}
.ab-photo .ring{position:absolute;width:30%;aspect-ratio:1;border-radius:50%;border:2px solid rgb(255 255 255/.25);right:-8%;top:-6%}
.ab-photo img{position:absolute;left:50%;bottom:0;width:88%;transform:translateX(-50%);transition:transform 1.4s var(--ease)}
.ab-photo:hover img{transform:translateX(-50%) scale(1.04)}
.ab-photo:hover .sun{transform:scale(1.08) translate(-3%,-3%)}
.stats{display:grid;gap:20px;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:48px;border-top:1.5px solid var(--line)}
.stats div{padding:26px 20px 0 0}
.stats b{font-family:var(--f-d);font-size:clamp(34px,4vw,64px);font-weight:800;color:var(--g8);line-height:1;display:block;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stats b em{color:var(--o5);font-style:normal}
.stats span{font-size:14px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
@media (max-width:900px){.ab{grid-template-columns:1fr}.ab-photo{max-width:520px}}

/* ---------- services list with hover preview ---------- */
.svc{border-top:1px solid rgb(255 255 255/.15)}
.svc a{display:grid;grid-template-columns:90px 1fr auto;align-items:center;gap:24px;padding:30px 0;border-bottom:1px solid rgb(255 255 255/.15);position:relative;overflow:hidden;isolation:isolate}
.svc a::before{content:"";position:absolute;inset:0;background:var(--o5);z-index:-1;transform:scaleY(0);transform-origin:bottom;transition:transform .6s var(--ease)}
.svc a:hover::before{transform:scaleY(1)}
.svc a:hover{color:var(--g9)}
.svc .n{font-weight:800;font-size:14px;opacity:.6;padding-left:12px}
.svc .t{font-family:var(--f-d);font-weight:800;font-size:clamp(34px,6vw,96px);line-height:1;letter-spacing:-.035em;text-transform:uppercase;transition:transform .6s var(--ease)}
.svc a:hover .t{transform:translateX(24px)}
.svc .c{font-weight:800;font-size:15px;padding-right:12px;display:flex;align-items:center;gap:14px;white-space:nowrap}
.svc .c i{font-style:normal;width:46px;height:46px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;transition:transform .6s var(--ease)}

/* ---------- router ---------- */
const app=document.getElementById("app");
let first=true, cur="";
function parse(){const h=(location.hash||"#home").slice(1);
  if(h.startsWith("project-")) return {page:"project",arg:h.slice(8)};
  if(h.startsWith("projects-")) return {page:"projects",arg:h.slice(9)};
  return {page:["about","projects","contact"].includes(h)?h:"home"};}
function render(){
  const r=parse(); const key=r.page+(r.arg||"");
  const html=r.page==="about"?pageAbout():r.page==="projects"?pageProjects(r.arg):r.page==="project"?pageProject(r.arg):r.page==="contact"?pageContact():pageHome();
  const swap=()=>{app.innerHTML=html; scrollTo(0,0); document.querySelectorAll(".nav a").forEach(a=>a.classList.toggle("on",a.dataset.r===(r.page==="project"?"projects":r.page))); enhance(r);
    document.title=(r.page==="project"&&byId[r.arg]?byId[r.arg].client+" · ":r.page!=="home"?r.page[0].toUpperCase()+r.page.slice(1)+" · ":"")+"Stanley Ugwu Portfolio";};
  document.body.classList.remove("menu-open");
  if(first||reduce){first=false;swap();cur=key;return;}
  // filter changes within projects page: no wipe
  if(r.page==="projects"&&cur.startsWith("projects")){cur=key;swap();return;}
  cur=key;
  const w=document.getElementById("wipe"); w.classList.remove("out"); w.classList.add("in");
  setTimeout(()=>{swap(); w.classList.add("out"); setTimeout(()=>w.classList.remove("in","out"),700);},560);
}
addEventListener("hashchange",render);

/* ---------- enhancements per page ---------- */
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const fine=matchMedia("(pointer:fine)").matches;
let io;
function enhance(r){
  // roll text
  document.querySelectorAll("[data-roll]").forEach(el=>{if(el.dataset.done)return;const t=el.textContent;el.innerHTML=`<span class="rw"><span>${esc(t)}</span><span>${esc(t)}</span></span>`;el.dataset.done=1;});
  // split headings
  const goNow=()=>{document.querySelectorAll(".split").forEach(s=>s.classList.add("go")); document.getElementById("hero")?.classList.add("go");};
  if(window.__booted||reduce) requestAnimationFrame(()=>requestAnimationFrame(goNow)); else {window.__booted=1; setTimeout(goNow,1150);}
  // reveals
  io?.disconnect();
  if(!reduce&&"IntersectionObserver" in window){
    io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.remove("pre");io.unobserve(e.target);}}),{threshold:.08,rootMargin:"0px 0px -6% 0px"});
    document.querySelectorAll(".rv,.clip").forEach(el=>{if(el.getBoundingClientRect().top>innerHeight*0.92){el.classList.add("pre");io.observe(el);}});
    const co=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;co.unobserve(e.target);const el=e.target,end=+el.dataset.count,em=el.querySelector("em")?.outerHTML||"";let t0;const st=t=>{t0??=t;const k=Math.min(1,(t-t0)/1400);el.innerHTML=Math.round(end*(1-Math.pow(1-k,4)))+em;if(k<1)requestAnimationFrame(st)};requestAnimationFrame(st);}),{threshold:.5});
    document.querySelectorAll("[data-count]").forEach(el=>co.observe(el));
  }
  // magnetic
  if(fine) document.querySelectorAll(".mag").forEach(b=>{b.onmousemove=e=>{const r=b.getBoundingClientRect();b.style.transform=`translate(${(e.clientX-r.left-r.width/2)*.25}px,${(e.clientY-r.top-r.height/2)*.35}px)`};b.onmouseleave=()=>{b.style.transition="transform .6s cubic-bezier(.19,1,.22,1)";b.style.transform="";setTimeout(()=>b.style.transition="",600)};});
  // services hover preview
  const svc=document.getElementById("svc"), pv=document.getElementById("preview"), pvi=document.getElementById("previewimg");
  pv.classList.remove("on");
  if(svc&&fine){svc.querySelectorAll("a").forEach(a=>{a.onmouseenter=()=>{pvi.src=a.dataset.prev;pv.classList.add("on")};a.onmouseleave=()=>pv.classList.remove("on");});}
  // testimonials
  setupTesti();
  // projects filter
  const ft=document.getElementById("ftabs");
  if(ft){const ind=document.getElementById("find");const place=()=>{const on=ft.querySelector(".ftab.on");if(on){ind.style.left=on.offsetLeft+"px";ind.style.width=on.offsetWidth+"px";}};place();setTimeout(place,300);
    ft.querySelectorAll(".ftab").forEach(b=>b.onclick=()=>{const f=b.dataset.f;history.replaceState(null,"",f==="all"?"#projects":"#projects-"+f);
      ft.querySelectorAll(".ftab").forEach(x=>x.classList.toggle("on",x===b));place();b.scrollIntoView({behavior:"smooth",inline:"center",block:"nearest"});
      const plats=PLAT_ORDER.filter(p=>platCount(p));const groups=f==="all"?plats:[plats.find(p=>slug(p)===f)];
      const list=document.getElementById("plist");list.innerHTML=groups.map(p=>`<div class="pgroup fade-in"><div class="pgroup-h"><h2>${esc(p)}</h2><span>${String(platCount(p)).padStart(2,"0")}</span><p>${esc(PLAT_INFO[p])}</p></div><div class="pgrid">${PROJECTS.filter(x=>x.platform===p).map(card).join("")}</div></div>`).join("");
      list.querySelectorAll(".pc").forEach((c,i)=>{c.style.animation=`fin .8s ${Math.min(i,8)*.06}s cubic-bezier(.19,1,.22,1) both`});
      const top=document.querySelector(".fbar").getBoundingClientRect().top; if(top>100) scrollBy({top:top-84,behavior:"smooth"});
    });}
  // gallery lightbox
  document.querySelectorAll(".gal figure").forEach(f=>f.onclick=()=>{document.getElementById("lbimg").src=f.dataset.src;document.getElementById("lb").classList.add("on")});
  // copy email
  const cp=document.getElementById("copy"); if(cp) cp.onclick=()=>{const t=document.getElementById("em").textContent;
    const ok=()=>{cp.textContent="Copied ✓";setTimeout(()=>cp.textContent="Copy email",1800)};
    try{navigator.clipboard.writeText(t).then(ok,()=>{selectEm();cp.textContent="Press Ctrl+C"})}catch(e){selectEm();cp.textContent="Press Ctrl+C"}};
  bindCursorTargets();
  fitText(); document.fonts?.ready.then(fitText);
}
function fitText(){
  document.querySelectorAll(".pd-hero h1, .bigname").forEach(h=>{
    h.style.fontSize=""; const pe=h.parentElement, cs=getComputedStyle(pe), box=pe.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight); let fs=parseFloat(getComputedStyle(h).fontSize), n=0;
    const widest=()=>Math.max(...[...h.querySelectorAll(h.classList.contains("bigname")?".wd":".w")].map(w=>w.scrollWidth),0);
    while(widest()>box*0.98&&n++<40){fs*=0.95;h.style.fontSize=fs+"px";}
  });
}
addEventListener("resize",()=>{clearTimeout(window.__ft);window.__ft=setTimeout(fitText,150)});
function selectEm(){const r=document.createRange();r.selectNodeContents(document.getElementById("em"));const s=getSelection();s.removeAllRanges();s.addRange(r);}
document.getElementById("lb").onclick=()=>document.getElementById("lb").classList.remove("on");
addEventListener("keydown",e=>{if(e.key==="Escape"){document.getElementById("lb").classList.remove("on");document.body.classList.remove("menu-open")}});

let tIdx=0,tTimer,tStart;
function setupTesti(){
  clearInterval(tTimer); const slides=[...document.querySelectorAll(".tslide")]; if(!slides.length) return; tIdx=0;
  const bar=document.getElementById("tbar"), cnt=document.getElementById("tcount"), D=7000;
  const show=i=>{tIdx=(i+slides.length)%slides.length;slides.forEach((s,j)=>s.classList.toggle("on",j===tIdx));cnt.textContent=String(tIdx+1).padStart(2,"0")+" / "+String(slides.length).padStart(2,"0");tStart=performance.now();};
  document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>show(tIdx+ +b.dataset.t));
  show(0);
  if(!reduce){const tick=()=>{if(!document.body.contains(bar))return;const k=(performance.now()-tStart)/D;bar.style.width=Math.min(100,k*100)+"%";if(k>=1)show(tIdx+1);requestAnimationFrame(tick)};requestAnimationFrame(tick);}
}

/* ---------- cursor ---------- */
const cu=document.getElementById("cur"), cd=document.getElementById("curd"), ct=document.getElementById("curt"), pv=document.getElementById("preview");
let mx=innerWidth/2,my=innerHeight/2,cx=mx,cy=my,px=mx,py=my;
addEventListener("mousemove",e=>{document.body.classList.add("moved");mx=e.clientX;my=e.clientY;cd.style.transform=`translate(${mx}px,${my}px)`;
  const g=document.getElementById("glow"); if(g) g.style.transform=`translate(calc(-50% + ${(mx-innerWidth/2)*.15}px), calc(-50% + ${(my-innerHeight/2)*.15}px))`;
  const hp=document.getElementById("hphoto"); if(hp) hp.style.transform=`translateX(calc(-50% + ${(mx-innerWidth/2)*-.02}px))`;});
(function loop(){cx+=(mx-cx)*.18;cy+=(my-cy)*.18;px+=(mx-px)*.12;py+=(my-py)*.12;cu.style.transform=`translate(${cx}px,${cy}px)`;if(pv.classList.contains("on")){pv.style.left=(px+24)+"px";pv.style.top=(py-130)+"px";}else{pv.style.left="-600px";}requestAnimationFrame(loop)})();
function bindCursorTargets(){
  if(!fine) return;
  document.querySelectorAll("[data-cursor]").forEach(el=>{el.onmouseenter=()=>{ct.textContent=el.dataset.cursor;cu.classList.add("big")};el.onmouseleave=()=>cu.classList.remove("big");});
  document.querySelectorAll("a:not([data-cursor]),button").forEach(el=>{el.addEventListener("mouseenter",()=>cu.classList.add("hov"));el.addEventListener("mouseleave",()=>cu.classList.remove("hov"));});
}

/* ---------- header, progress, parallax ---------- */
const hd=document.getElementById("hd"), prog=document.getElementById("progress"); let lastY=0;
addEventListener("scroll",()=>{const y=scrollY;hd.classList.toggle("solid",y>40);hd.classList.toggle("hide",y>lastY&&y>400&&!document.body.classList.contains("menu-open"));lastY=y;
  const max=document.documentElement.scrollHeight-innerHeight;prog.style.width=(max>0?y/max*100:0)+"%";
  const c=document.getElementById("cover"); if(c&&!reduce){const r=c.parentElement.getBoundingClientRect();c.style.transform=`translateY(${r.top*-.12}px)`;}
},{passive:true});
document.getElementById("burger").onclick=()=>{const o=document.body.classList.toggle("menu-open");document.getElementById("burger").setAttribute("aria-expanded",o);};

/* ---------- boot ---------- */
render();
const loader=document.getElementById("loader");
if(reduce){loader.remove();}
else{let n=0;const ln=document.getElementById("lnum");const t=setInterval(()=>{n=Math.min(100,n+Math.ceil(Math.random()*9));ln.textContent=n;if(n>=100){clearInterval(t);setTimeout(()=>{loader.classList.add("done");setTimeout(()=>loader.remove(),1100)},150)}},40);}
</script>
