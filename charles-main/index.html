<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Charles Chukwuma</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Charles Chukwuma uses AI to build websites, web apps, automations and AI agents for businesses worldwide.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed dark studio. Giant expanded display type edge to edge, ember accent,
   bone-coloured interludes, every page entered through an ember wipe. */
:root{
  --ink:#0B0B0C;        /* page ground */
  --char:#151517;       /* raised surface */
  --char-2:#1E1E21;
  --bone:#F2EEE8;       /* primary text / light interludes */
  --ash:#9A948D;        /* secondary text */
  --ember:#FF5A1F;      /* accent, from the brand ring */
  --ember-deep:#C93A0A;
  --line:rgba(242,238,232,.13);
  --line-ink:rgba(11,11,12,.14);
  --f-display:"Archivo", "Arial Narrow", Impact, system-ui, sans-serif;
  --f-body:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  --gut:clamp(16px, 3.2vw, 56px);
  --ease:cubic-bezier(.7,0,.2,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--ink);color:var(--bone);overflow-x:clip}
body{font-family:var(--f-body);font-size:clamp(17px,1.05vw + 10px,20px);line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--ink)}
::selection{background:var(--ember);color:var(--ink)}
a{color:inherit;text-decoration:none}
img,video{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--ember);outline-offset:4px;border-radius:4px}
h1,h2,h3,h4{margin:0;font-family:var(--f-display);font-weight:800;line-height:.9;letter-spacing:-.02em;text-wrap:balance}
p{margin:0}
.gut{padding-left:max(var(--gut),env(safe-area-inset-left,0px));padding-right:max(var(--gut),env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase}
.muted{color:var(--ash)}
.ember{color:var(--ember)}
.x{font-variation-settings:"wdth" 125}
.c{font-variation-settings:"wdth" 70}
.split-line{display:block;overflow:hidden;padding-bottom:.06em;margin-bottom:-.06em}
.split-line>span{display:inline-block;will-change:transform}

/* ---------- cursor ---------- */
.cursor,.cursor-dot{position:fixed;left:0;top:0;pointer-events:none;z-index:200;border-radius:50%;transform:translate(-50%,-50%)}
.cursor{width:44px;height:44px;border:1.5px solid var(--bone);mix-blend-mode:difference;display:grid;place-items:center;transition:width .35s var(--ease),height .35s var(--ease),background .35s,border-color .35s}
.cursor span{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);opacity:0;transition:opacity .2s}
.cursor.is-label{width:96px;height:96px;background:var(--bone);mix-blend-mode:normal;background:var(--ember);border-color:var(--ember)}
.cursor.is-label span{opacity:1}
.cursor.is-hover{width:70px;height:70px;background:var(--bone)}
.cursor-dot{width:6px;height:6px;background:var(--ember)}
@media (pointer:fine){body.has-cursor, body.has-cursor a, body.has-cursor button{cursor:none}}
@media (pointer:coarse){.cursor,.cursor-dot{display:none}}

/* ---------- preloader & transition ---------- */
.preloader{position:fixed;inset:0;z-index:150;background:var(--ink);display:flex;flex-direction:column;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 24px) max(var(--gut),env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(var(--gut),env(safe-area-inset-left,0px))}
.preloader .pl-top{display:flex;justify-content:space-between}
.preloader .pl-num{font-family:var(--f-display);font-weight:900;font-variation-settings:"wdth" 125;font-size:clamp(90px,22vw,340px);line-height:.8;color:var(--ember);letter-spacing:-.04em}
.preloader .pl-bar{height:2px;background:var(--line);position:relative;overflow:hidden;margin-top:18px}
.preloader .pl-bar i{position:absolute;inset:0;background:var(--ember);transform-origin:left;transform:scaleX(0)}
.wipe{position:fixed;inset:0;z-index:140;background:var(--ember);visibility:hidden;display:grid;place-items:center;pointer-events:none;padding:0 max(var(--gut),env(safe-area-inset-left,0px));text-align:center}
.wipe span{font-family:var(--f-display);font-weight:900;font-variation-settings:"wdth" 125;font-size:clamp(40px,8vw,150px);line-height:.9;color:var(--ink);letter-spacing:-.03em;text-transform:uppercase}
.wipe-2{background:var(--ink);z-index:139}

/* ---------- nav ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:100;padding-top:calc(env(safe-area-inset-top,0px) + 18px);padding-bottom:18px;display:flex;align-items:center;justify-content:space-between;gap:20px;mix-blend-mode:difference;color:#fff;transition:transform .5s var(--ease)}
.nav.hide{transform:translateY(-120%)}
.logo{font-family:var(--f-display);font-weight:900;font-variation-settings:"wdth" 125;font-size:22px;letter-spacing:-.02em;display:flex;gap:2px;align-items:baseline}
.logo sup{font-size:11px;font-family:var(--f-mono);font-weight:400}
.nav-links{display:flex;gap:6px;list-style:none;margin:0;padding:0}
.nav-links a{display:block;padding:8px 14px;font-weight:600;font-size:15px;position:relative;overflow:hidden}
.nav-links a span{display:block;transition:transform .45s var(--ease)}
.nav-links a span::after{content:attr(data-t);position:absolute;left:0;top:100%}
.nav-links a:hover span{transform:translateY(-100%)}
.nav-links a.active::before{content:"";position:absolute;left:14px;right:14px;bottom:4px;height:2px;background:#fff}
.nav-cta{display:flex;align-items:center;gap:14px}
.burger{display:none;width:48px;height:48px;border-radius:50%;border:1.5px solid #fff;place-items:center}
.burger i{display:block;width:18px;height:2px;background:#fff;box-shadow:0 -6px 0 #fff,0 6px 0 #fff}
@media (max-width:900px){.nav-links,.nav .pill{display:none}.burger{display:grid}}

.pill{display:inline-flex;align-items:center;gap:10px;padding:14px 24px;border-radius:999px;font-weight:700;font-size:15px;position:relative;overflow:hidden;isolation:isolate;border:1.5px solid currentColor;white-space:nowrap}
.pill::before{content:"";position:absolute;inset:0;background:var(--ember);transform:translateY(101%);border-radius:inherit;transition:transform .5s var(--ease);z-index:-1}
.pill:hover::before{transform:translateY(0)}
.pill:hover{color:var(--ink);border-color:var(--ember)}
.pill.solid{background:var(--ember);color:var(--ink);border-color:var(--ember)}
.pill.solid::before{background:var(--bone)}
.pill.solid:hover{border-color:var(--bone)}
.pill.big{padding:20px 34px;font-size:17px}
.pill .arr{display:inline-block;transition:transform .4s var(--ease)}
.pill:hover .arr{transform:translateX(4px) rotate(-45deg)}

/* mobile menu */
.menu{position:fixed;inset:0;z-index:120;background:var(--ember);color:var(--ink);clip-path:circle(0% at calc(100% - 40px) 40px);transition:clip-path .8s var(--ease);display:flex;flex-direction:column;justify-content:space-between;padding-top:calc(env(safe-area-inset-top,0px) + 90px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 28px)}
.menu.open{clip-path:circle(150% at calc(100% - 40px) 40px)}
.menu a.big{display:block;font-family:var(--f-display);font-weight:900;font-variation-settings:"wdth" 120;font-size:clamp(48px,13vw,120px);line-height:.95;letter-spacing:-.03em;text-transform:uppercase}
.menu-close{position:absolute;top:calc(env(safe-area-inset-top,0px) + 18px);right:max(var(--gut),env(safe-area-inset-right,0px));width:48px;height:48px;border-radius:50%;border:1.5px solid var(--ink);font-size:22px}
.menu-foot{display:flex;flex-wrap:wrap;gap:10px 22px;font-weight:700}

/* ---------- hero ---------- */
.hero{position:relative;min-height:clamp(640px,100svh,1100px);display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;padding-top:120px;padding-bottom:28px}
#net{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.hero-name{position:relative;z-index:2;font-family:var(--f-display);font-weight:900;font-variation-settings:"wdth" 125;text-transform:uppercase;letter-spacing:-.045em;line-height:.8;font-size:clamp(30px,11.4vw,260px);white-space:nowrap;pointer-events:none}
.hero-name .row{display:flex;justify-content:space-between;align-items:flex-end}
.hero-name .outline{color:transparent;-webkit-text-stroke:2px var(--bone)}
.hero-photo{position:absolute;z-index:1;right:max(var(--gut),env(safe-area-inset-right,0px));top:50%;width:clamp(240px,32vw,560px);aspect-ratio:1;transform:translateY(-58%);border-radius:50%;overflow:hidden;max-width:100%}
.hero-photo img{width:100%;height:100%;object-fit:cover}
.hero-photo::after{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(255,90,31,.4)}
.hero-meta{position:relative;z-index:2;display:grid;grid-template-columns:1.2fr 1fr auto;gap:28px;align-items:end;margin-bottom:clamp(28px,4vw,56px)}
.hero-meta .lead{font-size:clamp(20px,1.6vw + 8px,32px);line-height:1.25;font-weight:600;max-width:24ch}
.rot{display:inline-grid;vertical-align:bottom;overflow:hidden;height:1.25em;color:var(--ember)}
.rot span{grid-area:1/1;display:block}
.rot span:not(.on){opacity:0}
.hero-tags{display:grid;gap:8px}
.hero-tags div{display:flex;align-items:center;gap:10px}
.hero-tags i{width:8px;height:8px;border-radius:50%;background:var(--ember);box-shadow:0 0 0 0 rgba(255,90,31,.6);animation:ping 2s infinite}
@keyframes ping{70%{box-shadow:0 0 0 12px rgba(255,90,31,0)}100%{box-shadow:0 0 0 0 rgba(255,90,31,0)}}
.scroll-cue{display:flex;flex-direction:column;align-items:center;gap:10px}
.scroll-cue b{display:block;width:1.5px;height:56px;background:var(--line);position:relative;overflow:hidden}
.scroll-cue b::after{content:"";position:absolute;inset:0;background:var(--ember);animation:cue 1.8s var(--ease) infinite}
@keyframes cue{0%{transform:translateY(-100%)}100%{transform:translateY(100%)}}
@media (max-width:900px){
  .hero-photo{position:relative;right:auto;top:auto;transform:none;width:min(78vw,420px);margin:0 auto 28px}
  .hero{justify-content:flex-start}
  .hero-meta{grid-template-columns:1fr;gap:18px}
  .scroll-cue{display:none}
}

/* ---------- marquee ---------- */
.marquee{overflow:hidden;border-block:1px solid var(--line);padding-block:clamp(14px,2vw,26px);background:var(--ink);position:relative;z-index:2}
.marquee.ember-band{background:var(--ember);color:var(--ink);border:0;transform:rotate(-2deg) scale(1.04);margin-block:clamp(20px,4vw,60px)}
.mq-track{display:flex;width:max-content;will-change:transform}
.mq-track span{font-family:var(--f-display);font-weight:900;font-variation-settings:"wdth" 125;text-transform:uppercase;font-size:clamp(40px,7vw,120px);line-height:1;letter-spacing:-.03em;padding-right:.4em;white-space:nowrap;display:flex;align-items:center;gap:.4em}
.mq-track span em{font-style:normal;color:transparent;-webkit-text-stroke:2px currentColor}
.mq-track svg{width:.55em;height:.55em;flex:none}

/* ---------- sections ---------- */
.sec{padding-block:clamp(80px,11vw,180px);position:relative}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:clamp(40px,6vw,90px)}
.eyebrow{display:inline-flex;align-items:center;gap:12px;margin-bottom:22px}
.eyebrow::before{content:"";width:28px;height:2px;background:var(--ember)}
.h-xl{font-size:clamp(52px,9.4vw,180px);text-transform:uppercase;font-variation-settings:"wdth" 120;font-weight:900;letter-spacing:-.04em}
.h-lg{font-size:clamp(40px,6vw,110px);text-transform:uppercase;font-variation-settings:"wdth" 115;font-weight:900;letter-spacing:-.035em}
.h-md{font-size:clamp(28px,3.2vw,52px);font-weight:800;font-variation-settings:"wdth" 105}
.light{background:var(--bone);color:var(--ink)}
.light .muted{color:#5f5a54}
.light .pill:hover{color:var(--ink)}

/* statement fill */
.statement{font-family:var(--f-display);font-weight:700;font-variation-settings:"wdth" 100;font-size:clamp(32px,4.6vw,86px);line-height:1.04;letter-spacing:-.025em;max-width:22ch}
.statement .w{opacity:.14;transition:opacity .2s}
.statement .chip{display:inline-block;vertical-align:middle;width:1.6em;height:.9em;border-radius:999px;overflow:hidden;margin:0 .12em}
.statement .chip img{width:100%;height:100%;object-fit:cover}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);margin-top:clamp(60px,8vw,120px)}
.stat{padding:28px 20px 0 0;display:grid;gap:8px}
.stat + .stat{padding-left:20px;border-left:1px solid var(--line)}
.stat b{font-family:var(--f-display);font-weight:900;font-variation-settings:"wdth" 125;font-size:clamp(56px,7vw,128px);line-height:.85;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.stat b sup{font-size:.4em;color:var(--ember);vertical-align:top}
@media (max-width:760px){.stats{grid-template-columns:1fr 1fr}.stat:nth-child(3){border-left:0;padding-left:0}.stat{padding-bottom:24px}}

/* services rows */
.svc-list{border-top:1px solid var(--line-ink)}
.svc{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:32px;align-items:center;padding-block:clamp(26px,3.2vw,48px);border-bottom:1px solid var(--line-ink);position:relative;isolation:isolate}
.svc::before{content:"";position:absolute;inset:0 calc(-1 * var(--gut));background:var(--ink);transform:scaleY(0);transform-origin:bottom;transition:transform .55s var(--ease);z-index:-1}
.svc:hover::before{transform:scaleY(1);transform-origin:top}
.svc:hover{color:var(--bone)}
.svc:hover .muted{color:var(--ash)}
.svc h3{font-size:clamp(34px,5vw,92px);text-transform:uppercase;font-variation-settings:"wdth" 118;font-weight:900;letter-spacing:-.035em;transition:transform .55s var(--ease)}
.svc:hover h3{transform:translateX(18px)}
.svc .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.svc .tags span{font-family:var(--f-mono);font-size:12px;padding:5px 10px;border:1px solid currentColor;border-radius:999px;opacity:.75}
.svc .go{width:72px;height:72px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font-size:26px;transition:transform .5s var(--ease),background .3s,color .3s}
.svc:hover .go{background:var(--ember);border-color:var(--ember);color:var(--ink);transform:rotate(-45deg)}
@media (max-width:860px){.svc{grid-template-columns:1fr}.svc .go{display:none}}
.float-prev{position:fixed;left:0;top:0;width:340px;aspect-ratio:16/10;border-radius:14px;overflow:hidden;pointer-events:none;z-index:90;opacity:0;transform:translate(-50%,-50%) scale(.6);transition:opacity .3s,transform .4s var(--ease);box-shadow:0 30px 80px rgba(0,0,0,.5)}
.float-prev.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.float-prev img{width:100%;height:100%;object-fit:cover;object-position:top}
@media (pointer:coarse){.float-prev{display:none}}

/* horizontal websites */
.hs{position:relative}
.hs-track{display:flex;gap:clamp(18px,2vw,32px);width:max-content;padding-left:max(var(--gut),env(safe-area-inset-left,0px));padding-right:max(var(--gut),env(safe-area-inset-right,0px))}
@media (max-width:900px){.hs{overflow-x:auto;scroll-snap-type:x mandatory}.hs-track>*{scroll-snap-align:start}}
.wcard{width:clamp(300px,46vw,820px);display:grid;gap:18px;flex:none}
.frame{position:relative;border-radius:14px;overflow:hidden;background:var(--char);border:1px solid var(--line);aspect-ratio:16/10;max-width:100%}
.frame .bar{position:absolute;inset:0 0 auto;height:30px;background:var(--char-2);display:flex;align-items:center;gap:6px;padding:0 12px;z-index:2}
.frame .bar i{width:9px;height:9px;border-radius:50%;background:#3a3a3f}
.frame .bar i:first-child{background:var(--ember)}
.frame .bar em{font-style:normal;font-family:var(--f-mono);font-size:11px;color:var(--ash);margin-left:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frame img,.frame video{position:absolute;left:0;right:0;top:30px;width:100%;height:calc(100% - 30px);object-fit:cover;object-position:top;transition:transform .9s var(--ease),opacity .4s}
.frame video{opacity:0}
.frame.playing video{opacity:1}
.wcard:hover .frame img{transform:scale(1.04)}
.wmeta{display:flex;justify-content:space-between;align-items:flex-start;gap:18px}
.wmeta h3{font-size:clamp(26px,2.6vw,44px);font-variation-settings:"wdth" 110;text-transform:uppercase;letter-spacing:-.025em}
.wmeta .mono{margin-top:10px;display:block}
.live{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px;padding:10px 16px;border-radius:999px;background:var(--bone);color:var(--ink);white-space:nowrap;transition:background .3s}
.live:hover{background:var(--ember)}
.live i{width:7px;height:7px;border-radius:50%;background:#1F8A5B;box-shadow:0 0 0 3px rgba(31,138,91,.25)}

/* automation flow */
.flow-wrap{border:1px solid var(--line);border-radius:24px;background:var(--char);padding:clamp(20px,3vw,40px);overflow-x:auto}
.flow-wrap svg{width:100%;min-width:760px;height:auto;display:block}
.flow-wrap text{font-family:var(--f-mono);font-size:13px;fill:var(--bone)}
.flow-wrap .sub{fill:var(--ash);font-size:11px}

/* automation cards */
.agrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(16px,1.6vw,28px)}
@media (max-width:1100px){.agrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.agrid{grid-template-columns:1fr}}
.acard{display:grid;gap:16px;align-content:start;transform-style:preserve-3d;transition:transform .2s}
.acard .thumb{aspect-ratio:16/10;border-radius:14px;overflow:hidden;background:var(--char);border:1px solid var(--line);position:relative;max-width:100%}
.acard .thumb img{width:100%;height:100%;object-fit:cover;object-position:top left;transition:transform .9s var(--ease)}
.acard:hover .thumb img{transform:scale(1.06)}
.acard .thumb .badge{position:absolute;left:12px;top:12px;z-index:2}
.acard h3{font-size:clamp(21px,1.6vw,28px);font-variation-settings:"wdth" 100;font-weight:800;letter-spacing:-.015em;line-height:1.08}
.acard p{color:var(--ash);font-size:.93em;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.badge{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:6px 10px;border-radius:6px;background:var(--ink);color:var(--bone);border:1px solid var(--line)}
.badge.claude{background:var(--ember);color:var(--ink);border-color:var(--ember)}
.badge.n8n{background:#EA4B71;color:#fff;border-color:#EA4B71}
.badge.make{background:#6D00CC;color:#fff;border-color:#6D00CC}
.gen{position:absolute;inset:0;background:radial-gradient(120% 90% at 100% 0%,rgba(255,90,31,.28),transparent 60%),var(--char)}
.gen svg{position:absolute;inset:0;width:100%;height:100%}
.gen b{position:absolute;left:16px;bottom:12px;right:16px;font-family:var(--f-display);font-weight:900;font-variation-settings:"wdth" 120;text-transform:uppercase;font-size:clamp(22px,2.2vw,36px);line-height:.9;letter-spacing:-.03em;color:var(--bone)}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:clamp(30px,4vw,56px)}
.filters button{padding:12px 20px;border-radius:999px;border:1.5px solid var(--line);font-weight:700;font-size:15px;transition:background .3s,color .3s,border-color .3s}
.filters button sup{font-family:var(--f-mono);font-size:10px;margin-left:4px;color:var(--ash)}
.filters button:hover{border-color:var(--bone)}
.filters button.on{background:var(--bone);color:var(--ink);border-color:var(--bone)}
.filters button.on sup{color:var(--ink)}

/* testimonials */
.tgrid{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:clamp(24px,4vw,72px);align-items:start}
@media (max-width:900px){.tgrid{grid-template-columns:1fr}}
.vid{position:relative;border-radius:22px;overflow:hidden;background:#000;aspect-ratio:9/14;max-width:100%;max-height:82vh;margin-inline:auto;width:100%}
