<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portfolios</title>
<style>
:root{--bg:#0E0B0A;--fg:#F5EDE4;--muted:#A39286;--accent:#FF5A1F;--card:#181311;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;padding:clamp(40px,8vw,96px) max(16px,4vw)}
h1{font-size:clamp(32px,6vw,64px);margin:0 0 8px;letter-spacing:-.02em}p{color:var(--muted);margin:0 0 40px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:16px;max-width:1100px}
a{display:grid;gap:6px;padding:28px;border-radius:18px;background:var(--card);border:1px solid rgba(245,237,228,.12);color:inherit;text-decoration:none;transition:border-color .2s,transform .2s}
a:hover{border-color:var(--accent);transform:translateY(-3px)}a b{font-size:22px}a span{color:var(--muted);font-size:15px}a i{font-style:normal;color:var(--accent);font-weight:600;margin-top:8px}
</style></head><body>
<h1>Portfolios</h1><p>Three portfolio websites.</p>
<div class="grid">
<a href="charles-main/"><b>Charles Chukwuma</b><span>Main portfolio: websites, web apps, automations and AI agents.</span><i>Open →</i></a>
<a href="charles-chiro/"><b>Charles Chukwuma · Chiropractic</b><span>24 websites for chiropractors and wellness practices.</span><i>Open →</i></a>
<a href="stanley/"><b>Stanley Ugwu</b><span>Stanley's portfolio and case studies.</span><i>Open →</i></a>
</div></body></html>
